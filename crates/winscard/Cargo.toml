[package]
name = "winscard"
version = "0.3.3"
edition = "2024"
readme = "README.md"
license = "MIT/Apache-2.0"
homepage = "https://github.com/devolutions/sspi-rs"
repository = "https://github.com/devolutions/sspi-rs"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
description = "A Rust implementation of WinSCard"

[features]
std = ["tracing/std", "base64", "picky-asn1-der"]

[lib]
name = "winscard"

[dependencies]
bitflags = "2.11"
iso7816 = "0.1"
iso7816-tlv = "0.4"
picky = { version = "=7.0.0-rc.26", features = ["x509"] }
picky-asn1-x509 = "0.15"
tracing = { version = "0.1", features = ["attributes"] }
time = { version = "0.3", default-features = false, features = [
    "formatting",
] }
uuid = { version = "1.23", features = ["v4"] }
flate2 = { version = "1.1", default-features = false }
rsa = { version = "=0.10.0-rc.18", features = ["hazmat"] }
sha1 = { version = "0.11", default-features = false }
base64 = { version = "0.23", optional = true }
picky-asn1-der = { version = "0.5", optional = true }
num-derive = "0.5"
num-traits = { version = "0.2", default-features = false }
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc"] }
widestring = "1.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }

# Apple Clang cannot use system zlib for wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
proptest = "1.6"
rand = "0.10"

[lints]
workspace = true
